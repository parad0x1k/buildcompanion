name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes the older run's result irrelevant; cancel it instead of
# queuing a full xvfb + VS Code test run. Runs on other refs (e.g. main) get a unique group so they
# are neither cancelled nor replaced while queued.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Compile and audit
    runs-on: ubuntu-latest
    # A hung VS Code download/launch would otherwise hold the runner for GitHub's 6-hour default.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Run tests
        run: xvfb-run -a npm test

      - name: Audit production dependencies
        run: npm run audit
