<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Concept F: Puzzle Build -->
  <!-- Four interlocking puzzle pieces frame a central code tile.  -->
  <!-- "Code (center) + modular assembly (frame) = building with code." -->
  <!-- Palette borrows from user's lego draft (purple/teal/lavender) + AWS orange accent. -->
  <defs>
    <clipPath id="roundedF">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedF)">
    <rect width="512" height="512" fill="#0F172A"/>

    <!-- Top-left puzzle piece (purple) -->
    <path d="
      M 64 64
      H 224
      V 128
      a 28 28 0 0 0 32 0
      V 64
      H 256
      V 224
      a 28 28 0 0 1 0 32
      H 192
      V 256
      H 64
      Z
    " fill="#7C3AED"/>

    <!-- Top-right puzzle piece (teal) -->
    <path d="
      M 256 64
      H 448
      V 256
      H 320
      V 224
      a 28 28 0 0 0 -32 0
      V 256
      H 256
      V 192
      a 28 28 0 0 1 0 -32
      Z
    " fill="#14B8A6"/>

    <!-- Bottom-left puzzle piece (lavender) -->
    <path d="
      M 64 256
      H 192
      V 288
      a 28 28 0 0 1 32 0
      V 256
      H 256
      V 448
      H 64
      Z
    " fill="#A5B4FC"/>

    <!-- Bottom-right puzzle piece (deep purple) -->
    <path d="
      M 256 256
      H 288
      a 28 28 0 0 0 0 32
      H 256
      V 320
      H 320
      V 288
      a 28 28 0 0 1 32 0
      V 320
      H 448
      V 448
      H 256
      Z
    " fill="#6366F1"/>

    <!-- Central code tile -->
    <rect x="160" y="160" width="192" height="192" rx="20" fill="#1E40AF"/>

    <!--
      Center glyph: faithful rescale of resources/codebuild.svg (viewBox 0 0 128 128).
      Wrapper translates to the center tile's origin and scales 1.5x so the original
      glyph fills the 192x192 tile. Stroke colors swapped from slate (#5A6775) to
      white for legibility on the deep-blue tile; green check kept as-is.
    -->
    <g transform="translate(160 160) scale(1.5)" fill="none">
      <rect x="14" y="18" width="100" height="92" rx="12" stroke="#FFFFFF" stroke-width="10"/>
      <path d="M30 42H98" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <path d="M30 64H76" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <path d="M30 86H62" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
      <circle cx="92" cy="82" r="14" stroke="#22C55E" stroke-width="8"/>
      <path d="M85 82L90 87L99 77" stroke="#22C55E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
